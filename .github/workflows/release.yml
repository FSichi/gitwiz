name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # allow manual runs while testing trusted publishing

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - name: Diagnostics
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC token endpoint: available"
          else
            echo "OIDC token endpoint: MISSING (id-token permission not effective)"
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Auth comes from GitHub's OIDC token via Trusted Publishing (no NPM_TOKEN).
      - run: npm publish --provenance --access public
